<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>摩诃婆罗多 · 卡牌图鉴</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Noto Serif SC", serif;
    }
    body {
        min-height: 100vh;
        color: #f5e9cf;
        background:
            radial-gradient(circle at 10% 10%, rgba(255,215,0,0.18), transparent 28%),
            radial-gradient(circle at 90% 18%, rgba(255,180,0,0.16), transparent 28%),
            radial-gradient(circle at 15% 85%, rgba(139,69,19,0.18), transparent 28%),
            radial-gradient(circle at 85% 90%, rgba(139,90,43,0.18), transparent 28%),
            linear-gradient(180deg, #3a2518 0%, #25150e 100%);
        background-attachment: fixed;
        text-align: center;
        padding: 18px 12px 88px;
        overflow-x: hidden;
        position: relative;
    }
    .container {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
    }
    .main-frame {
        position: relative;
        padding: 34px 20px 28px;
        margin: 0 auto 24px;
        background: rgba(50,38,22,0.90);
        border-radius: 20px;
        box-shadow:
            0 0 45px rgba(166,131,66,0.18),
            inset 0 0 55px rgba(133,99,42,0.12);
    }
    .ornate-border {
        position: absolute;
        inset: -10px;
        border-radius: 24px;
        pointer-events: none;
        z-index: 1;
        opacity: 0.32;
        background-image: url("data:image/svg+xml,%3Csvg width='600' height='600' viewBox='0 0 600 600' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='vineBorder' width='100' height='100' patternUnits='userSpaceOnUse'%3E%3Cpath d='M50,0 C75,0 100,25 100,50 C100,75 75,100 50,100 C25,100 0,75 0,50 C0,25 25,0 50,0 Z' fill='none' stroke='%23d1a658' stroke-width='1.4' opacity='0.38'/%3E%3Ccircle cx='50' cy='50' r='12' fill='none' stroke='%23d1a658' stroke-width='1.2' opacity='0.35'/%3E%3C/pattern%3E%3C/defs%3E%3Crect x='0' y='0' width='600' height='600' fill='url(%23vineBorder)'/%3E%3C/svg%3E");
        background-size: 100px 100px;
        background-position: center;
    }
    .corner-ornament {
        position: absolute;
        width: 120px;
        height: 120px;
        opacity: 0.42;
        pointer-events: none;
    }
    .corner-ornament.tl {
        top: 0;
        left: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,60 C30,60 30,20 60,20 C30,20 30,0 60,0 M0,70 C40,70 40,30 70,30 M0,0 L40,40' stroke='%23d1a658' stroke-width='1.3' fill='none'/%3E%3Ccircle cx='66' cy='16' r='6' fill='none' stroke='%23d1a658' stroke-width='1.2'/%3E%3Cpath d='M62,12 L66,10 L70,12 L68,16 L66,20 L62,16 Z' fill='%23d1a658' opacity='0.7'/%3E%3C/svg%3E");
    }
    .corner-ornament.tr {
        top: 0;
        right: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120,60 C90,60 90,20 60,20 C90,20 90,0 60,0 M120,70 C80,70 80,30 50,30 M120,0 L80,40' stroke='%23d1a658' stroke-width='1.3' fill='none'/%3E%3Ccircle cx='54' cy='16' r='6' fill='none' stroke='%23d1a658' stroke-width='1.2'/%3E%3Cpath d='M50,12 L54,10 L58,12 L56,16 L54,20 L50,16 Z' fill='%23d1a658' opacity='0.7'/%3E%3C/svg%3E");
    }
    .corner-ornament.bl {
        bottom: 0;
        left: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,60 C30,60 30,100 60,100 C30,100 30,120 60,120 M0,50 C40,50 40,90 70,90 M0,120 L40,80' stroke='%23d1a658' stroke-width='1.3' fill='none'/%3E%3Ccircle cx='66' cy='104' r='6' fill='none' stroke='%23d1a658' stroke-width='1.2'/%3E%3Cpath d='M62,100 L66,98 L70,100 L68,104 L66,108 L62,104 Z' fill='%23d1a658' opacity='0.7'/%3E%3C/svg%3E");
    }
    .corner-ornament.br {
        bottom: 0;
        right: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120,60 C90,60 90,100 60,100 C90,100 90,120 60,120 M120,50 C80,50 80,90 50,90 M120,120 L80,80' stroke='%23d1a658' stroke-width='1.3' fill='none'/%3E%3Ccircle cx='54' cy='104' r='6' fill='none' stroke='%23d1a658' stroke-width='1.2'/%3E%3Cpath d='M50,100 L54,98 L58,100 L56,104 L54,108 L50,104 Z' fill='%23d1a658' opacity='0.7'/%3E%3C/svg%3E");
    }
    .divider-ornate {
        width: 140px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #d1a658, transparent);
        margin: 18px auto;
        position: relative;
    }
    .divider-ornate::before,
    .divider-ornate::after {
        content:"ॐ";
        position:absolute;
        top:-12px;
        color:#d1a658;
        font-size: 18px;
    }
    .divider-ornate::before { left:-28px; }
    .divider-ornate::after { right:-28px; }
    h1 {
        font-size: 32px;
        letter-spacing: 3px;
        color: #ffe8b8;
        font-weight: normal;
    }
    .sanskrit-head-main {
        font-size: 24px;
        color: #e6c275;
        letter-spacing: 4px;
        margin: 8px 0;
    }
    .sanskrit-sub {
        font-size: 17px;
        color: #d4b888;
        margin-bottom: 24px;
    }
    .btn {
        width: 200px;
        padding: 14px 20px;
        margin: 10px auto;
        font-size: 17px;
        border: 1px solid #e6c275;
        background: rgba(255,249,236,0.08);
        color: #ffe8b8;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.35s ease;
        letter-spacing: 1px;
        display: block;
    }
    .btn:hover {
        background: rgba(230,194,117,0.18);
        box-shadow: 0 0 18px rgba(230,194,117,0.45);
    }
    .bgm-toggle-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(230,194,117,0.45);
        background: rgba(28,22,13,0.68);
        color: #e6c275;
        font-size: 19px;
        cursor: pointer;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.25s;
    }
    .bgm-toggle-btn:hover {
        background: rgba(230,194,117,0.18);
    }
    .page {
        display: none;
    }
    .page.active {
        display: block;
    }
    .shuffle-layer {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, rgba(22,16,9,0.97), #070503);
        z-index: 90;
        display: none;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .shuffle-layer.show {
        display: flex;
    }
    .shuffle-stage {
        position: relative;
        width: 460px;
        height: 460px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .pile-card {
        position: absolute;
        width: 150px;
        height: 210px;
        border-radius: 12px;
        background: #1c1710;
        border: 2px solid #d1a658;
        opacity: 0;
        transform-origin: center;
        box-shadow: 0 0 18px rgba(209,166,88,0.25);
    }
    .pile-card::before {
        content: "ॐ";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(220,182,108,0.55);
        font-size: 42px;
    }
    .final-card {
        position: absolute;
        width: 160px;
        height: 224px;
        border-radius: 14px;
        background: #1c1710;
        border: 3px solid #d1a658;
        opacity: 0;
        z-index: 30;
        box-shadow: 0 0 25px rgba(209,166,88,0.35);
    }
    .final-card::before {
        content: "ॐ";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(220,182,108,0.55);
        font-size: 48px;
    }
    .final-card.light-ur {
        border-color: #e9c74f;
        box-shadow: 0 0 20px rgba(233,199,79,0.65), 0 0 40px rgba(233,199,79,0.4);
    }
    .final-card.light-ssr {
        border-color: #d4af37;
        box-shadow: 0 0 20px rgba(212,175,55,0.65), 0 0 40px rgba(212,175,55,0.4);
    }
    .final-card.light-sr {
        border-color: #a8d8ff;
        box-shadow: 0 0 20px rgba(168,216,255,0.65), 0 0 40px rgba(168,216,255,0.4);
    }
    .final-card.light-hidden {
        border-color: #b873ff;
        box-shadow: 0 0 20px rgba(184,115,255,0.65), 0 0 40px rgba(184,115,255,0.4);
    }
    .shuffle-text {
        position: absolute;
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(220,182,108,0.75);
        font-size: 14px;
        letter-spacing: 2px;
    }
    @keyframes pileFlyIn {
        0% {
            transform: translateY(140px) scale(0.5) rotate(var(--r));
            opacity: 0;
        }
        100% {
            transform: translateY(0) scale(1) rotate(var(--r));
            opacity: 1;
        }
    }
    @keyframes slightShuffle {
        0% {transform: rotate(0deg)}
        50% {transform: rotate(120deg)}
        100% {transform: rotate(240deg)}
    }
    @keyframes cardRiseCenter {
        0% {
            transform: translateY(100px) scale(0.5) rotateY(180deg);
            opacity: 0;
        }
        45% {
            transform: translateY(-12px) scale(1.12) rotateY(0deg);
            opacity: 1;
        }
        100% {
            transform: translateY(0) scale(1) rotateY(0deg);
            opacity: 1;
        }
    }
    @keyframes glowPulse {
        0%, 100% {
            filter: brightness(1);
        }
        50% {
            filter: brightness(1.25);
        }
    }
    .card-flip-wrap {
        width: 240px;
        height: 336px;
        margin: 30px auto;
        perspective: 1100px;
    }
    .flip-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.95s cubic-bezier(0.22, 0.61, 0.36, 1);
        transform-style: preserve-3d;
    }
    .card-flip-wrap.flipped .flip-inner {
        transform: rotateY(180deg);
    }
    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
        backface-visibility: hidden;
    }
    .card-back-face {
        background:
            radial-gradient(circle at center, rgba(26,20,12,0.95), rgba(10,8,5,0.98)),
            repeating-linear-gradient(
                45deg,
                transparent 0px,
                transparent 12px,
                rgba(209,166,88,0.08) 12px,
                rgba(209,166,88,0.08) 24px
            );
        border: 2px solid #d1a658;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .back-ornament-box {
        width: 84%;
        height: 84%;
        border: 1px solid rgba(212,172,96,0.46);
        border-radius: 9px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: rgba(220,182,108,0.68);
        background: rgba(255,250,240,0.08);
    }
    .om-mark {
        font-size: 42px;
        margin-bottom: 10px;
    }
    .back-sanskrit-text {
        font-size: 15px;
        letter-spacing: 3px;
    }
    .card-front-face {
        background: #221a10;
        transform: rotateY(180deg);
        border: 1px solid #c9b48c;
        aspect-ratio: 5 / 8;
        overflow: hidden;
    }
    .card-front-face img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background-color:#1a140c;
    }
    .draw-result-info {
        margin-top: 12px;
    }
    .rarity-text {
        font-size: 18px;
        color: #e6c275;
        font-weight: bold;
    }
    .card-name-text {
        font-size: 17px;
        margin-top: 6px;
        color: #ffe8b8;
    }
    .album-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
        justify-content: center;
        margin-top: 24px;
    }
    .album-card {
        width: 100%;
        background: rgba(50,38,22,0.80);
        border: 1px solid rgba(230,194,117,0.45);
        border-radius: 12px;
        padding: 10px;
        cursor: pointer;
        transition: 0.25s ease;
        display:flex;
        flex-direction:column;
    }
    .album-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 8px 16px rgba(130,100,50,0.25);
    }
    .album-card-media{
        width:100%;
        aspect-ratio:5/8;
        position:relative;
        overflow:hidden;
    }
    .album-card-media img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background-color:#1a140c;
        border-radius: 8px;
    }
    .album-card-name {
        margin-top: 8px;
        font-size: 13px;
        color: #f5e9cf;
    }
    .album-card-rarity {
        font-size: 12px;
        color: #e6c275;
    }
    .album-count {
        font-size: 11px;
        color: #d4b888;
        margin-top: 4px;
    }
    .empty-album {
        margin-top: 40px;
        font-size: 16px;
        color: #b8a47c;
    }
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(12,9,5,0.92);
        z-index: 99;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .modal-overlay.open {
        display: flex;
    }
    .modal-card-box {
        max-width: 340px;
    }
    .modal-card-box img {
        width: 100%;
        aspect-ratio: 5 / 8;
        object-fit: contain;
        background-color:#1a140c;
        border-radius: 14px;
        border: 2px solid #d1a658;
    }
    .modal-name {
        color: #ffe8b8;
        margin-top: 14px;
        font-size: 18px;
    }
    .modal-rarity {
        color: #e6c275;
        font-size: 15px;
        margin-top: 6px;
    }
    .close-modal-tip {
        color: #b8a47c;
        margin-top: 16px;
        font-size: 13px;
    }
    .album-complete-overlay{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.85);
        display:none;
        z-index:120;
        align-items:center;
        justify-content:center;
        padding:20px;
    }
    .album-complete-overlay.open{
        display:flex;
    }
    .album-complete-box{
        display:flex;
        align-items:flex-start;
        gap:16px;
        max-width:560px;
    }
    .pixel-square-avatar{
        width:84px;
        height:84px;
        border-radius:4px;
        overflow:hidden;
        border:4px solid transparent;
        background-image:url("data:image/svg+xml,%3Csvg width='90' height='90' viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='peacockFeather' width='20' height='20' patternUnits='userSpaceOnUse'%3E%3Cpath d='M0,10 Q5,2 10,10 T20,10' fill='none' stroke='%23d1a658' stroke-width='1' opacity='0.4'/%3E%3Ccircle cx='10' cy='10' r='2' fill='%23d1a658' opacity='0.3'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='90' height='90' fill='url(%23peacockFeather)'/%3E%3C/svg%3E");
        background-origin:border-box;
        flex-shrink:0;
    }
    .pixel-square-avatar img{
        width:100%;
        height:100%;
        object-fit:cover;
    }
    .parchment-dialog{
        border:8px solid;
        border-image: linear-gradient(135deg,#b89458,#e6c275,#8c6b3b) 4;
        border-radius:6px;
        padding:6px;
    }
    .parchment-inner{
        background:linear-gradient(145deg,#e9ddc0,#d8c6a0);
        padding:20px 24px;
        border-radius:4px;
        box-shadow:inset 0 0 22px rgba(92,64,28,0.22);
    }
    .parchment-text{
        font-family:monospace,"Noto Serif SC",serif;
        color:#3a2714;
        font-size:16px;
        line-height:1.8;
        letter-spacing:1px;
    }
    /*=====【新增】视频彩蛋弹窗样式 =====*/
    .video-modal-overlay{
        position:fixed;
        inset:0;
        background:#000000;
        z-index:130;
        display:none;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        padding:12px;
    }
    .video-modal-overlay.open{
        display:flex;
    }
    .video-modal-overlay video{
        max-width:100%;
        max-height:85vh;
        border-radius:8px;
    }
    .video-close-tip{
        color:#cccccc;
        margin-top:12px;
        font-size:14px;
    }
    @media (max-width: 480px) {
        h1 {
            font-size: 28px;
        }
        .main-frame {
            padding: 30px 16px 24px;
        }
        .album-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        .shuffle-stage {
            width: 360px;
            height: 360px;
        }
        .pile-card {
            width: 130px;
            height: 182px;
        }
        .final-card {
            width: 140px;
            height: 196px;
        }
    }
</style>
</head>
<body>
<div class="container">
    <div id="pageMain" class="page active">
        <div class="main-frame">
            <div class="ornate-border"></div>
            <div class="corner-ornament tl"></div>
            <div class="corner-ornament tr"></div>
            <div class="corner-ornament bl"></div>
            <div class="corner-ornament br"></div>
            <div class="divider-ornate"></div>
            <div class="sanskrit-head-main">॥ महाभारतम् ॥</div>
            <h1>摩诃婆罗多 · 卡牌图鉴</h1>
            <div class="sanskrit-sub">यतो धर्मस्ततो जयः</div>
            <div class="divider-ornate"></div>
            <button class="btn" onclick="startDrawProcess()">单次祈愿抽卡</button>
            <button class="btn" onclick="openAlbum()">卡牌图鉴</button>
            <button class="btn" onclick="openEasterVideo()">观看广告以获得次数</button>
            <div class="divider-ornate"></div>
            <div style="color:#d4b888">剩余祈愿次数：<span id="drawTicket">15</span></div>
        </div>
    </div>
    <div id="pageResult" class="page">
        <h2 style="color:#ffe8b8">祈愿结果</h2>
        <div class="divider-ornate"></div>
        <div class="card-flip-wrap" id="flipCardDom">
            <div class="flip-inner">
                <div class="card-face card-back-face">
                    <div class="back-ornament-box">
                        <div class="om-mark">ॐ</div>
                        <div class="back-sanskrit-text">महाभारत</div>
                    </div>
                </div>
                <div class="card-face card-front-face">
                    <img id="resultCardImg">
                </div>
            </div>
        </div>
        <div class="draw-result-info">
            <div class="rarity-text" id="resultRarityDom"></div>
            <div class="card-name-text" id="resultNameDom"></div>
        </div>
        <br>
        <button class="btn" onclick="resetFlipBackHome()">继续祈愿</button>
        <button class="btn" onclick="openAlbum()">打开图鉴</button>
    </div>
    <div id="pageAlbum" class="page">
        <h2 style="color:#ffe8b8">卡牌图鉴</h2>
        <div class="divider-ornate"></div>
        <div id="albumContainer"></div>
        <br>
        <button class="btn" onclick="backMainPage()">返回祈愿页面</button>
    </div>
</div>
<div class="shuffle-layer" id="shuffleAnimLayer">
    <div class="shuffle-stage" id="shuffleStage"></div>
    <div class="final-card" id="finalCard"></div>
    <div class="shuffle-text">॥ महाभारतम् ॥</div>
</div>
<div class="modal-overlay" id="cardModalOverlay">
    <div class="modal-card-box">
        <img id="modalBigImg">
        <div class="modal-card-name" id="modalCardName"></div>
        <div class="modal-rarity" id="modalCardRarity"></div>
        <div class="close-modal-tip">点击任意位置关闭</div>
    </div>
</div>
<!--【新增：彩蛋视频弹窗HTML】 -->
<div class="video-modal-overlay" id="videoEasterOverlay">
    <video id="easterVideoPlayer" controls preload="auto">
        <source src="./easter_video.mp4" type="video/mp4">
    </video>
    <div class="video-close-tip">视频播放完毕自动获得10次祈愿；点击视频外黑色区域关闭弹窗</div>
</div>
<div class="bgm-toggle-btn" onclick="toggleHomeBGM()">🔊</div>
<div class="album-complete-overlay" id="completeEasterOverlay">
    <div class="album-complete-box">
        <div class="pixel-square-avatar">
            <img src="assets/img/avatar.png">
        </div>
        <div class="parchment-dialog">
            <div class="parchment-inner">
                <div class="parchment-text">
                    诸般业果已然显现，不要执着于所得，亦不要怅惘于未曾得见的命运。<br>
                    世间万事，皆有它注定的归宿，好好想想吧:)
                </div>
            </div>
        </div>
    </div>
</div>
<script>
// ===========音频资源【文件名统一小写mp3】===========
const homeBgm = new Audio();
homeBgm.preload = "auto";
homeBgm.src = "./mainBGM.mp3";
homeBgm.loop = true;
homeBgm.volume = 0.35;
let homeBgmStatus = false;
let audioUnlocked = false;
const drawAnimAudio = new Audio();
drawAnimAudio.preload = "auto";
drawAnimAudio.src = "./chouka.mp3";
drawAnimAudio.loop = false;
drawAnimAudio.volume = 0.4;
const cardAudioList = {
    "般度":{src:"./banduBGM.mp3",vol:0.4},
    "沙恭尼":{src:"./shagongniBGM.mp3",vol:0.4},
    "持国":{src:"./chiguoBGM.mp3",vol:0.4},
    "天誓":{src:"./tianshiBGM.mp3",vol:0.4},
    "激昂":{src:"./jiangBGM.mp3",vol:0.4},
    "迦尔纳":{src:"./jiaernaBGM.mp3",vol:0.4},
    "毗湿摩":{src:"./bishimaBGM.mp3",vol:0.4},
    "难敌":{src:"./nandiBGM.mp3",vol:0.4},
    "奎师那":{src:"./kuishinaBGM.mp3",vol:0.4},
    "迦尔纳-犬":{src:"./jiahidden.mp3",vol:0.4},
    "难敌-猫":{src:"./nanhidden.mp3",vol:0.4},
};
let currentCardVoice = null;
let modalPlayingCard = null;
//初始抽卡次数
let drawTicket = 18;
const ticketDom = document.getElementById("drawTicket");
ticketDom.innerText = drawTicket;

//====【新增彩蛋视频JS变量】====
const videoEasterOverlay = document.getElementById("videoEasterOverlay");
const easterVideoPlayer = document.getElementById("easterVideoPlayer");
let videoWatchCompleteRewardGiven = false;
let bgmWasPlayingBeforeVideo = false;
//集齐彩蛋只弹出一次标记
let albumCompleteHasShown = false;

// 统一暂停主BGM（所有非首页操作都会调用，且无自动恢复）
function pauseMainBGM() {
    homeBgm.pause();
}
// 仅切回首页专用恢复函数，其余地方一律不调用
function onlyHomeResumeBGM() {
    if (audioUnlocked && homeBgmStatus) {
        homeBgm.loop = true;
        homeBgm.play().catch(e => console.log("BGM恢复异常", e));
    }
}
// 页面任意点击解锁音频（仅执行一次，兼容移动端）
async function unlockAudioOnce() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
        await homeBgm.play();
        homeBgmStatus = true;
    } catch (e) {
        console.log("自动启动BGM失败，点击右下角喇叭开启：", e);
    }
}
document.addEventListener("click", unlockAudioOnce, { once: true });
// 右下角喇叭开关（手动控制，不影响页面规则）
function toggleHomeBGM() {
    if (!audioUnlocked) {
        unlockAudioOnce();
        return;
    }
    if (homeBgmStatus) {
        homeBgm.pause();
        homeBgmStatus = false;
    } else {
        homeBgm.loop = true;
        homeBgm.play().catch(e => console.log("BGM播放异常：", e));
        homeBgmStatus = true;
    }
}
// 播放抽卡音效：仅暂停BGM，结束无任何恢复逻辑
function playDrawAudio() {
    pauseMainBGM();
    drawAnimAudio.currentTime = 0;
    drawAnimAudio.play().catch(e => {});
}
// 抽卡结果卡牌语音：播放完毕也不恢复BGM
function playCardMusic(cardName) {
    stopDrawCardAudio();
    const audioInfo = cardAudioList[cardName];
    if (!audioInfo) return;
    pauseMainBGM();
    const audio = new Audio(audioInfo.src);
    audio.volume = audioInfo.vol;
    audio.play().catch(e => console.log("卡牌音频播放异常：", e));
    currentCardVoice = audio;
}
// 停止抽卡页面语音（仅停止音频，不恢复BGM）
function stopDrawCardAudio() {
    if (currentCardVoice) {
        currentCardVoice.pause();
        currentCardVoice.currentTime = 0;
        currentCardVoice = null;
    }
}
// 停止图鉴弹窗语音（仅停止音频，不恢复BGM）
function stopModalCardAudio() {
    if (modalPlayingCard) {
        modalPlayingCard.pause();
        modalPlayingCard.currentTime = 0;
        modalPlayingCard = null;
    }
}
// 全部卡牌语音强制停止
function stopAllCardAudio() {
    stopDrawCardAudio();
    stopModalCardAudio();
}

//====【修复：彩蛋视频逻辑函数，处理BGM冲突】====
//打开视频弹窗
function openEasterVideo(){
    videoWatchCompleteRewardGiven = false;
    easterVideoPlayer.currentTime = 0;
    bgmWasPlayingBeforeVideo = homeBgmStatus;
    if(bgmWasPlayingBeforeVideo){
        homeBgm.pause();
    }
    easterVideoPlayer.play().catch(e=>console.log("视频播放触发需要用户交互"));
    videoEasterOverlay.classList.add("open");
}
//视频播放结束事件：给+10抽卡
easterVideoPlayer.onended = function(){
    if(!videoWatchCompleteRewardGiven){
        videoWatchCompleteRewardGiven = true;
        drawTicket += 10;
        ticketDom.innerText = drawTicket;
        alert("观看完毕！获得10次祈愿次数！");
    }
};
//点击黑色遮罩关闭视频弹窗，恢复之前BGM状态
videoEasterOverlay.onclick = function(ev){
    if(ev.target === videoEasterOverlay){
        easterVideoPlayer.pause();
        videoEasterOverlay.classList.remove("open");
        if(bgmWasPlayingBeforeVideo && audioUnlocked){
            homeBgm.loop=true;
            homeBgm.play().catch(e=>{});
        }
    }
};

//抽卡权重
const WEIGHT_SR = 9;
const WEIGHT_SSR = 7;
const WEIGHT_UR = 5;
const WEIGHT_HIDDEN = 4;
const cardDatabase = [
    { name: "般度", rarity: "SR", img: "./assets/img/bandu.png", weight: WEIGHT_SR, isNormalCard:true },
    { name: "沙恭尼", rarity: "SR", img: "./assets/img/shagongni.gif", weight: WEIGHT_SR, isNormalCard:true },
    { name: "持国", rarity: "SR", img: "./assets/img/chiguo.png", weight: WEIGHT_SR, isNormalCard:true },
    { name: "天誓", rarity: "SR", img: "./assets/img/tianshi.png", weight: WEIGHT_SR, isNormalCard:true },
    { name: "激昂", rarity: "SR", img: "./assets/img/jiang.png", weight: WEIGHT_SR, isNormalCard:true },
    { name: "迦尔纳", rarity: "SSR", img: "./assets/img/jiaerna.png", weight: WEIGHT_SSR, isNormalCard:true },
    { name: "毗湿摩", rarity: "SSR", img: "./assets/img/bishima.png", weight: WEIGHT_SSR, isNormalCard:true },
    { name: "难敌", rarity: "SSR", img: "./assets/img/nandi.png", weight: WEIGHT_SSR, isNormalCard:true },
    { name: "奎师那", rarity: "UR", img: "./assets/img/kuishina.jpg", weight: WEIGHT_UR, isNormalCard:true },
    { name: "迦尔纳-犬", rarity: "HIDDEN", img: "./assets/img/hide_a.gif", weight: WEIGHT_HIDDEN, isNormalCard:false },
    { name: "难敌-猫", rarity: "HIDDEN", img: "./assets/img/hide_b.gif", weight: WEIGHT_HIDDEN, isNormalCard:false }
];
let cardAlbumData = {};
let getCurrentCard = null;
let obtainOrder = [];
//DOM元素缓存
const flipCardDom = document.getElementById("flipCardDom");
const resultCardImg = document.getElementById("resultCardImg");
const resultNameDom = document.getElementById("resultNameDom");
const resultRarityDom = document.getElementById("resultRarityDom");
const albumContainer = document.getElementById("albumContainer");
const shuffleLayer = document.getElementById("shuffleAnimLayer");
const shuffleStage = document.getElementById("shuffleStage");
const finalCard = document.getElementById("finalCard");
const modalOverlay = document.getElementById("cardModalOverlay");
const modalBigImg = document.getElementById("modalBigImg");
const modalCardName = document.getElementById("modalCardName");
const modalCardRarity = document.getElementById("modalCardRarity");
const completeEasterOverlay = document.getElementById("completeEasterOverlay");
//彩蛋弹窗关闭
completeEasterOverlay.onclick = function(){
    completeEasterOverlay.classList.remove("open");
}
//图鉴弹窗关闭：只停卡牌音频，绝不恢复BGM
modalOverlay.onclick = function(){
    modalOverlay.classList.remove("open");
    stopModalCardAudio();
}

function hideAllPage() {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
}
// 返回首页：停止所有卡牌音 + 唯一一处恢复BGM
function backMainPage() {
    hideAllPage();
    document.getElementById("pageMain").classList.add("active");
    stopAllCardAudio();
    onlyHomeResumeBGM();
    checkAllCardComplete();
}
// 打开图鉴：强制暂停BGM，全程不恢复
function openAlbum() {
    hideAllPage();
    document.getElementById("pageAlbum").classList.add("active");
    stopDrawCardAudio();
    pauseMainBGM();
    renderAlbum();
}
function resetCardFlip() {
    flipCardDom.classList.remove("flipped");
}
//随机抽卡算法
function randomPickCard() {
    let totalW = cardDatabase.reduce((sum, item) => sum + item.weight, 0);
    let randomNum = Math.random() * totalW;
    for (let card of cardDatabase) {
        randomNum -= card.weight;
        if (randomNum <= 0) return card;
    }
    return cardDatabase[cardDatabase.length - 1];
}
function getRarityLightClass(rarity) {
    const map = {
        "UR": "light-ur",
        "SSR": "light-ssr",
        "SR": "light-sr",
        "HIDDEN": "light-hidden"
    };
    return map[rarity] || "light-sr";
}
//抽卡动画逻辑完全未改动
function runPileAnimation() {
    shuffleStage.innerHTML = "";
    finalCard.style.opacity = "0";
    finalCard.className = "final-card";
    shuffleStage.style.animation = "";
    const pileCount = 16;
    const radius = 160;
    for (let i = 0; i < pileCount; i++) {
        const div = document.createElement("div");
        div.className = "pile-card";
        const angle = (i / pileCount) * Math.PI * 2;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        div.style.left = `calc(50% + ${x -75}px)`;
        div.style.top = `calc(50% + ${y -105}px)`;
        div.style.setProperty("--r", `${angle*35}deg`);
        shuffleStage.appendChild(div);
    }
    shuffleLayer.classList.add("show");
    const pileCards = document.querySelectorAll(".pile-card");
    pileCards.forEach((card, i) => {
        setTimeout(() => {
            card.style.animation = "pileFlyIn 0.8s ease forwards";
        }, i * 30);
    });
    setTimeout(() => {
        shuffleStage.style.animation = "slightShuffle 1.4s ease-in-out";
    },1000);
    setTimeout(() => {
        const lightClass = getRarityLightClass(getCurrentCard.rarity);
        finalCard.className = "final-card " + lightClass;
        finalCard.style.opacity = "1";
        finalCard.style.animation = "cardRiseCenter 1.2s ease forwards, glowPulse 1.6s infinite";
    },2600);
    setTimeout(() => {
        closeShuffleAnim();
        showResultDirectly();
    },4200);
}
function closeShuffleAnim() {
    shuffleLayer.classList.remove("show");
    shuffleStage.style.animation = "";
    finalCard.style.opacity = "0";
    finalCard.className = "final-card";
}
function startDrawProcess() {
    if(drawTicket <= 0){
        alert("祈愿次数已用尽！");
        return;
    }
    drawTicket--;
    ticketDom.innerText = drawTicket;
    playDrawAudio();
    getCurrentCard = randomPickCard();
    if (cardAlbumData[getCurrentCard.name]) {
        cardAlbumData[getCurrentCard.name] += 1;
    } else {
        cardAlbumData[getCurrentCard.name] = 1;
        obtainOrder.push(getCurrentCard.name);
    }
    runPileAnimation();
}
//翻牌延迟内播放卡牌语音，动画正常走完
function showResultDirectly() {
    hideAllPage();
    document.getElementById("pageResult").classList.add("active");
    resultCardImg.src = getCurrentCard.img;
    resultNameDom.innerText = getCurrentCard.name;
    resultRarityDom.innerText = getCurrentCard.rarity;
    resetCardFlip();
    setTimeout(() => {
        flipCardDom.classList.add("flipped");
        playCardMusic(getCurrentCard.name);
    }, 380);
}
function resetFlipBackHome() {
    resetCardFlip();
    setTimeout(() => backMainPage(), 600);
}
//检测集齐卡牌彩蛋：只弹出一次
function checkAllCardComplete(){
    const normalCardList = cardDatabase.filter(item=>item.isNormalCard).map(c=>c.name);
    const collectedNormal = Object.keys(cardAlbumData).filter(name=>normalCardList.includes(name));
    if(collectedNormal.length >= normalCardList.length && !albumCompleteHasShown){
        albumCompleteHasShown = true;
        setTimeout(()=>{
            completeEasterOverlay.classList.add("open");
        },400);
    }
}
//渲染图鉴：只渲染已经抽到的卡牌，不渲染未获得
function renderAlbum() {
    albumContainer.innerHTML = "";
    if (obtainOrder.length === 0) {
        albumContainer.innerHTML = `<p class="empty-album">图鉴尚且空白，前往祈愿收集卡牌。</p >`;
        return;
    }
    const uniqueCardList = [];
    const tempMap = new Set();
    obtainOrder.forEach(name => {
        if (!tempMap.has(name)) {
            tempMap.add(name);
            uniqueCardList.push(name);
        }
    });
    const gridWrap = document.createElement("div");
    gridWrap.className = "album-grid";
    uniqueCardList.forEach(cardName => {
        const targetCard = cardDatabase.find(c => c.name === cardName);
        if (!targetCard) return;
        const cardBox = document.createElement("div");
        cardBox.className = "album-card";
        cardBox.innerHTML = `
            <div class="album-card-media">
                <img src="${targetCard.img}">
            </div>
            <div class="album-card-name">${targetCard.name}</div>
            <div class="album-card-rarity">${targetCard.rarity}</div>
            <div class="album-count">持有 ×${cardAlbumData[cardName]}</div>
        `;
        //图鉴点击卡牌：仅暂停BGM，播放完也不恢复
        cardBox.onclick = function () {
            modalBigImg.src = targetCard.img;
            modalCardName.innerText = targetCard.name;
            modalCardRarity.innerText = targetCard.rarity;
            modalOverlay.classList.add("open");
            stopModalCardAudio();
            pauseMainBGM();
            const audioInfo = cardAudioList[targetCard.name];
            if(audioInfo){
                const audio = new Audio(audioInfo.src);
                audio.volume = audioInfo.vol;
                audio.play().catch(e=>{});
                modalPlayingCard = audio;
            }
        };
        gridWrap.appendChild(cardBox);
    });
    albumContainer.appendChild(gridWrap);
}
//一键解锁全部卡牌测试
function unlockAllCards(){
    cardDatabase.forEach(card=>{
        if(!cardAlbumData[card.name]){
            cardAlbumData[card.name] = 1;
            obtainOrder.push(card.name);
        }
    });
    checkAllCardComplete();
    alert("全部卡牌已解锁，可以查看彩蛋！");
}
 </script>
 </body>
 </html>
